:root{--bg:#F4F0EC;--surface:#fff;--surface2:#F8F4F1;--ink:#1C181A;--mut:#6A605A;--line:#E2DAD4;--primary:#EB6D23;--primary-ink:#1C181A;--ptx:#B34706;--side:#1C181A;--side-ink:#D6CEC8;--led:#FF8A3D;--ok:#12805A;--bad:#C0352B;--warn:#8A5A00;--s1:#EB6D23;--s2:#4A4442;--axis:#A89E97;--floor:#F3EEEA;--cline:#9A8F88;--shotok:#12805A;--shotbad:#C0352B;

--card:var(--surface);--card2:var(--surface2);--tx:var(--ink);--acc:var(--primary);--acc2:var(--primary);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#120F10;--surface:#1C181A;--surface2:#262123;--ink:#F3EEEA;--mut:#A89E97;--line:#352F2D;--primary:#F2813A;--primary-ink:#1C181A;--ptx:#F59A5E;--side:#0E0B0C;--side-ink:#B9AFA8;--ok:#3DD598;--bad:#FF7A70;--warn:#FFC857;--s1:#F2813A;--s2:#B9AFA8;--axis:#6A605A;--floor:#211C1E;--cline:#6A605A;--shotok:#3DD598;--shotbad:#FF7A70;color-scheme:dark}}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--fb);font-variant-numeric:tabular-nums}
a{color:var(--ptx);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--side);color:var(--side-ink);padding:20px 12px 14px;display:flex;flex-direction:column;gap:2px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='244' height='260' viewBox='0 0 244 260' fill='none' stroke='%23ffffff' stroke-opacity='.06' stroke-width='2'><path d='M-40 260V150a160 160 0 0 1 324 0v110'/><rect x='62' y='150' width='120' height='120'/><circle cx='122' cy='150' r='40'/></svg>");background-repeat:no-repeat;background-position:bottom}
.brand{display:flex;align-items:center;gap:10px;color:#fff;padding:2px 8px 18px}
.brand svg{flex:none}.brand b{font:700 26px/1 var(--fd);letter-spacing:.02em}.brand small{display:block;color:var(--side-ink);font:500 11.5px/1.2 var(--fb);letter-spacing:0}
.ngrp{font:600 11.5px var(--fb);color:#968B84;padding:14px 10px 4px}
.side a.nl{display:flex;align-items:center;gap:10px;color:var(--side-ink);padding:8px 10px;border-radius:7px;font-weight:500;position:relative}
.side a.nl svg{width:18px;height:18px;flex:none;opacity:.85}
.side a.nl:hover{background:rgba(255,255,255,.06);color:#fff;text-decoration:none}
.side a.nl.on{background:rgba(255,255,255,.1);color:#fff}

.syn{display:flex;align-items:center;gap:8px;margin:8px 0 6px;padding:7px 9px;border-radius:7px;background:rgba(255,255,255,.06);font-size:12.5px;cursor:pointer;color:var(--side-ink)}.syn .grow{flex:1}.syn .dot{width:8px;height:8px;border-radius:50%;background:#8a8480;flex:none}.syn.g .dot{background:#3fb56b}.syn.w .dot{background:#f0a030}.syn button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:12px;padding:3px 8px}@media print{.syn{display:none!important}}.side .cb{margin:8px 0 0;width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#DCE5F1;font-size:13px;cursor:pointer}.side .cb:hover{background:rgba(255,255,255,.14)}@media print{.cb{display:none!important}}.pli{padding:10px 0;border-top:1px solid var(--line)}.pli:first-of-type{border-top:0;padding-top:2px}.pli.off{opacity:.55}.chips{display:flex;flex-wrap:wrap;gap:6px}.chips .gpill,.pli .gpill{padding:3px 10px;border-radius:99px;font-weight:600;font-size:12.5px;border:0;font-family:inherit}.chips .gpill{cursor:pointer}.shell>.main{min-width:0}.row>.grow{min-width:0}select{max-width:100%}.syn .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media screen and (max-width:900px){.side .brand{order:0}.side .cb{order:1;flex:0 0 auto;width:auto;margin:0 8px;white-space:nowrap}.side .syn{order:1;flex:0 0 auto;max-width:190px;margin:0 8px}.side #nav{order:2}.side .sbtn{order:3}}

/* ===== Aspectos técnico-tácticos ===== */
.tt-row{display:grid;grid-template-columns:minmax(0,1.3fr) auto minmax(0,1fr);gap:8px 14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tt-row:last-child{border-bottom:0}.tt-n b{display:block}.tt-n small{display:block;color:var(--mut);font-size:12px;line-height:1.35}
.tt-ref{display:inline-block;margin-top:3px;font-size:11.5px;background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:0 6px}
.tt5{display:flex;gap:4px}.tt5 button{min-width:38px;padding:6px 0;text-align:center;font-weight:650}.tt5 button.na{min-width:44px;font-size:12px;color:var(--mut)}
.tt5 button.on.ok{background:var(--ok);border-color:var(--ok);color:var(--bg)}.tt5 button.on.mid{background:#E0A800;border-color:#E0A800;color:#1C181A}.tt5 button.on.bad{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.tt5 button.na.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tt-note{width:100%;box-sizing:border-box}
.tt-mk{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.ttb{font-size:12px;padding:3px 9px}.ttb.ok{color:var(--ok);border-color:var(--ok)}.ttb.bad{color:var(--bad);border-color:var(--bad)}
.ttc{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:99px;padding:0 2px 0 4px;font-size:12px}.ttc.ok{border-color:var(--ok)}.ttc.bad{border-color:var(--bad)}.ttc button{border:0;background:transparent;padding:2px 5px;font-size:12px}.ttc i{font-style:normal;color:var(--mut);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttck{display:flex;align-items:center;gap:8px;padding:3px 0}.ttck label{cursor:pointer}
.ttm{display:grid;grid-template-columns:54px 1fr 30px;gap:6px;align-items:center;font-size:12px;margin:4px 0}.ttm div{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}.ttm i{display:block;height:100%}.ttm b{text-align:right}
.ttl{margin:4px 0 0;font-size:11px;line-height:1.3}.ttup{color:var(--ok)}.ttdn{color:var(--bad)}
.grg.g4{grid-template-columns:1fr 1fr 1.4fr}

@media print{.gr .grg.g4{grid-template-columns:1.25fr 1fr 1fr}.gr .ttm{margin:2px 0;font-size:10px}.gr .ttl{font-size:9.5px}}

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtT=t=>{t=Math.max(0,Math.floor(t));const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')};
const pct=v=>v==null?'–':(v*100).toFixed(1)+'%';

function orphanIds(){const o={};const add=(id,k,g)=>{if(!id||id==='OPP'||player(id))return;const r=o[id]=o[id]||{id,ev:0,games:new Set()};r.ev+=k;r.games.add(g.id)};
 S.games.forEach(g=>{g.events.forEach(e=>add(e.pid,1,g));(g.subs||[]).forEach(e=>add(e.pid,0,g));Object.keys(g.min||{}).forEach(k=>add(k,0,g))});
 return Object.values(o).map(r=>({id:r.id,ev:r.ev,ng:r.games.size}))}
function mergePid(from,to){S.games.forEach(g=>{[g.events,g.subs,g.tec].forEach(L=>(L||[]).forEach(e=>{if(e.pid===from)e.pid=to}));if(g.min&&from in g.min){g.min[to]=(g.min[to]||0)+g.min[from];delete g.min[from]}});
 const st=S.settings||{};['pnotes','phones','pgoals'].forEach(k=>{const m=st[k];if(m&&from in m){if(!(to in m))m[to]=m[from];delete m[from]}})}
const game=id=>S.games.find(g=>g.id===id);

const div=(a,b)=>b?a/b:null;
const sum=(arr,f)=>arr.reduce((s,x)=>s+f(x),0);
const nf=v=>v==null||!isFinite(v)?'–':(Number.isInteger(v)?String(v):v.toFixed(1));
const shortDate=d=>{const m=/^\d{4}-(\d\d)-(\d\d)$/.exec(d||'');return m?m[2]+'/'+m[1]:(d||'')};
function agg(evs){
 const c={};for(const k in EV)c[k]=0;evs.forEach(e=>c[e.type]++);
 const twm=c['2M'],twa=twm+c['2X'],tpm=c['3M'],tpa=tpm+c['3X'];
 const fgm=twm+tpm,fga=twa+tpa,ftm=c.FTM,fta=ftm+c.FTX;
 const pts=2*twm+3*tpm+ftm,reb=c.OREB+c.DREB,miFG=fga-fgm,miFT=fta-ftm;
 const uso=fga+0.44*fta+c.TO;
 const a={c,pts,fgm,fga,fgp:div(fgm,fga),twm,twa,twp:div(twm,twa),tpm,tpa,tpp:div(tpm,tpa),ftm,fta,ftp:div(ftm,fta),
  reb,oreb:c.OREB,dreb:c.DREB,ast:c.AST,stl:c.STL,blk:c.BLK,to:c.TO,pf:c.PF,pfd:c.PFD,blka:c.BLKA,miFG,miFT,uso,stocks:c.STL+c.BLK,
  efg:div(fgm+0.5*tpm,fga),ts:div(pts,2*(fga+0.44*fta)),pps:div(pts-ftm,fga),tpar:div(tpa,fga),ftr:div(fta,fga),
  astto:div(c.AST,c.TO),tovp:div(c.TO,uso),orebp:div(c.OREB,reb),
  eff:pts+reb+c.AST+c.STL+c.BLK-miFG-miFT-c.TO,
  feb:pts+reb+c.AST+c.STL+c.BLK+c.PFD-miFG-miFT-c.TO-c.PF-c.BLKA,
  gmsc:pts+0.4*fgm-0.7*fga-0.4*miFT+0.7*c.OREB+0.3*c.DREB+c.STL+0.7*c.AST+0.7*c.BLK-0.4*c.PF-c.TO,
  fp:pts+1.2*reb+1.5*c.AST+3*c.STL+3*c.BLK-c.TO};
 const nd=[a.pts,a.reb,a.ast,a.stl,a.blk].filter(x=>x>=10).length;a.dd=nd>=2?1:0;a.td=nd>=3?1:0;
 return a;
}
const gameEvents=(g,pid)=>g.events.filter(e=>!pid||e.pid===pid);
function playerGames(pid){return S.games.filter(g=>!g.ex&&g.events.some(e=>e.pid===pid)).sort((a,b)=>b.date.localeCompare(a.date))}
function teamPts(g){return agg(g.events).pts}
function oppOf(g){if(!(g.oppScore===''||g.oppScore==null||isNaN(+g.oppScore)))return+g.oppScore;const o=g.oev||[];return o.some(e=>['2M','3M','FTM'].includes(e.type))?agg(o).pts:null}
function resultOf(g){const o=oppOf(g);if(o==null)return null;const a=teamPts(g);return a>o?'V':a<o?'D':'E'}

function teamAdv(evs,opp,oevs){

 intro=gp<3?`Con menos de tres partidos (${gp}), el perfil de ${name} es provisional y hace falta más muestra antes de sacar conclusiones firmes. `:`Perfil de ${name} sobre ${gp} partidos. `;
 const pg=v=>v/gp;
 if(a.fga>=5){
  if(a.ts>=0.55)st.push(`Anotación eficiente: TS% de ${pct(a.ts)}.`);else if(a.ts<0.45)wk.push(`Eficiencia de anotación baja (TS% ${pct(a.ts)}); revisar selección de tiro.`);
  if(a.twa>=4){if(a.twp>=0.5)st.push(`Buen acierto en tiros de 2 (${pct(a.twp)}).`);else if(a.twp<0.4)wk.push(`Poco acierto en tiros de 2 (${pct(a.twp)}).`)}
 }
 if(a.tpa>=3){if(a.tpp>=0.35)st.push(`Amenaza exterior: ${pct(a.tpp)} en triples (${a.tpm}/${a.tpa}).`);else if(a.tpp<0.25)wk.push(`Triple poco fiable (${a.tpm}/${a.tpa}).`)}
 else if(a.fga>=5)wk.push(`Casi no tira de tres (${a.tpa} intentos): perfil muy interior o falta de confianza.`);
 if(a.fta>=4){if(a.ftp>=0.75)st.push(`Fiable desde la línea de tiros libres (${pct(a.ftp)}).`);else if(a.ftp<0.6)wk.push(`Tiros libres mejorables (${pct(a.ftp)}).`)}
 if(a.fga>0&&a.fta/a.fga>=0.35)st.push('Busca y fuerza el contacto: muchos tiros libres respecto a sus tiros de campo.');
 if(pg(a.reb)>=6)st.push(`Aporta mucho en el rebote (${f1(pg(a.reb))} por partido).`);
 else if(gp>=2&&pg(a.reb)<1.5&&a.fga>=5)wk.push('Poca presencia en el rebote.');
 if(a.ast>=3&&a.ast>=a.to)st.push(`Buen creador: ${a.ast} asistencias frente a ${a.to} pérdidas.`);
 if(a.to>=3&&a.to>=a.ast+2)wk.push(`Cuidar el balón: ${a.to} pérdidas con ${a.ast} asistencias.`);
 if(pg(a.stl+a.blk)>=2)st.push(`Impacto defensivo (${f1(pg(a.stl+a.blk))} robos+tapones por partido).`);
 else if(a.stl+a.blk===0)wk.push('Sin robos ni tapones registrados.');
 if(pg(a.pf)>=3.5)wk.push(`Muchas faltas (${f1(pg(a.pf))} por partido).`);
 if(pg(a.pts)>=10)st.push(`Anotador de dobles dígitos (${f1(pg(a.pts))} puntos por partido).`);
 if(!st.length)st.push('Todavía no destaca claramente en ninguna faceta.');
 if(!wk.length)wk.push('No se detectan áreas débiles claras con esta muestra.');
 return{intro,st,wk};
}

function playReel(W){

async function makeReel(W){

 const vw=v.videoWidth||1280,vh=v.videoHeight||720,CW=Math.min(1280,vw),CH=Math.round(CW*vh/vw)&~1,cv=document.createElement('canvas');cv.width=CW;cv.height=CH;

 try{const vs=v.captureStream?v.captureStream():v.mozCaptureStream();vs.getAudioTracks().forEach(t=>stream.addTrack(t))}catch(e){}
 const mime=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4;codecs=avc1,mp4a.40.2','video/mp4;codecs=avc1','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
 let rec;try{rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:4e6}:{})}catch(e){return toast('No se pudo iniciar la grabación')}
 const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
 const total=winDur(W)+(clipOpt.title?2.5:0),t0=Date.now(),oldRate=v.playbackRate;
 mk={cancel:false,msg:'',ui(){const b=$('#mk');if(b)b.disabled=true;const c=$('#mcancel');if(c)c.disabled=false;const s=$('#mkst');if(s)s.textContent=this.msg}};
 const say=m=>{mk.msg=m;const s=$('#mkst');if(s)s.textContent=m};
 let card=null,cap='',cnt='';
 const wrap=(t,w)=>{const out=[];let line='';t.split(' ').forEach(x=>{const tt=line?line+' '+x:x;if(cx.measureText(tt).width>w&&line){out.push(line);line=x}else line=tt});if(line)out.push(line);return out};
 const draw=()=>{
  if(card){cx.fillStyle='#1C181A';cx.fillRect(0,0,CW,CH);cx.fillStyle='#EB6D23';cx.fillRect(CW*.1,CH*.5+4,CW*.8,4);cx.fillStyle='#fff';cx.textAlign='center';cx.font=`700 ${Math.round(CW/22)}px system-ui,sans-serif`;
   wrap(card,CW*.8).forEach((l,i,a)=>cx.fillText(l,CW/2,CH*.5-10-(a.length-1-i)*CW/18));cx.textAlign='left';return}

   cx.fillStyle='rgba(14,17,22,.78)';cx.fillRect(0,CH-h,CW,h);cx.fillStyle='#fff';lines.forEach((l,i)=>cx.fillText(l,fs*.8,CH-h+fs*1.4+i*fs*1.5));
   cx.fillStyle='#EB6D23';cx.textAlign='right';cx.fillText(cnt,CW-fs*.8,CH-h+fs*1.4);cx.textAlign='left'}
 };

 const sleep=ms=>new Promise(r=>setTimeout(r,ms));
 const seek=s=>new Promise(r=>{const h=()=>{v.removeEventListener('seeked',h);r()};v.addEventListener('seeked',h);v.currentTime=s;setTimeout(()=>{v.removeEventListener('seeked',h);r()},2000)});
 try{

  v.pause();v.playbackRate=1;rec.start(500);
  if(clipOpt.title){card=clipOpt.label;say('Grabando tarjeta de título…');await sleep(2500);card=null}

   const w=W[i],end=Math.min(w.e,v.duration||w.e);cap=w.labels.slice(0,3).join('\n')+(w.labels.length>3?`\n+${w.labels.length-3} jugadas más`:'');cnt=`${i+1}/${W.length}`;

function ffmpegScript(W){
 const vf=G.videoName||'partido.mp4';const sh=[];
 sh.push('#!/bin/sh','# Genera un clip por jugada y los une en reel.mp4. Ejecutar en la carpeta del vídeo.',`IN="${vf.replace(/"/g,'')}"`,'mkdir -p clips');

 W.forEach((w,i)=>{const s=w.s,d=w.e-w.s,n=String(i+1).padStart(3,'0');
  sh.push(`ffmpeg -y -ss ${s.toFixed(1)} -i "$IN" -t ${d.toFixed(1)} -c:v libx264 -c:a aac clips/${n}.mp4`);
  bat.push(`ffmpeg -y -ss ${s.toFixed(1)} -i "%IN%" -t ${d.toFixed(1)} -c:v libx264 -c:a aac clips\\${n}.mp4`);list.push(`file 'clips/${n}.mp4'`)});

}

function teamCtx(gs){
 const A=agg(gs.flatMap(g=>g.events)),gsO=gs.filter(g=>(g.oev||[]).length),hasO=gsO.length>0;

 const opos=oa.fga+0.44*oa.fta-oa.oreb+oa.to,N=gs.length;
 const wo=gs.filter(g=>oppOf(g)!=null);
 const pf=sum(wo,g=>teamPts(g)),pc=sum(wo,g=>oppOf(g));
 const posW=sum(wo,g=>teamAdv(g.events,g.oppScore,g.oev).pos),oposW=sum(wo,g=>teamAdv(g.events,g.oppScore,g.oev).opos);
 const rec={V:0,D:0,E:0};wo.forEach(g=>rec[resultOf(g)]++);
 const qd=[0,1,2,3].map(i=>{const L=gs.filter(g=>qOpp(g,i)!=null&&g.events.some(e=>e.q===QS[i]));return{q:QS[i],n:L.length,d:L.length?sum(L,g=>agg(g.events.filter(e=>e.q===QS[i])).pts-qOpp(g,i))/L.length:null}});
 return{gs,A,B,oa,hasO,opos,N,wo,nw:wo.length,pf,pc,rec,qd,gsO,ortg:posW>0?100*pf/posW:null,drtg:oposW>0?100*pc/oposW:null,zs:zoneStats(gs.flatMap(g=>g.events))};
}

function scoreStream(g){
 const sb=g.subs||[],op=(g.oev||[]).filter(e=>PTV[e.type]);if(!sb.length||!op.length)return null;
 const st=[];g.events.forEach(e=>PTV[e.type]&&st.push({k:1,pts:PTV[e.type],q:e.q,t:e.t,cr:e.cr||0}));op.forEach(e=>st.push({k:1,pts:-PTV[e.type],q:e.q,t:e.t,cr:e.cr||0}));

 st.sort((a,b)=>QS.indexOf(a.q)-QS.indexOf(b.q)||a.t-b.t||a.cr-b.cr||a.k-b.k);
 const on=new Set(),out=[];st.forEach(x=>{if(!x.k){x.on?on.add(x.pid):on.delete(x.pid)}else out.push({pts:x.pts,on:[...on]})});return out;
}
function lineupStats(gs){

 gs.forEach(g=>{const S_=scoreStream(g);if(!S_)return;used++;const seen=new Set((g.subs||[]).map(s=>s.pid)),tot={pf:0,pc:0};
  S_.forEach(x=>{x.pts>0?tot.pf+=x.pts:tot.pc-=x.pts;const on=[...x.on].sort(),f=x.pts>0?'pf':'pc',p=Math.abs(x.pts);
   if(on.length===5){const k=on.join('|');(five[k]=five[k]||{ids:on,pf:0,pc:0})[f]+=p}
   for(let i=0;i<on.length;i++){const a=oo[on[i]]=oo[on[i]]||{on:{pf:0,pc:0},tot:{pf:0,pc:0}};a.on[f]+=p;for(let j=i+1;j<on.length;j++){const k=on[i]+'|'+on[j];(pair[k]=pair[k]||{ids:[on[i],on[j]],pf:0,pc:0})[f]+=p}}});
  seen.forEach(id=>{const a=oo[id]=oo[id]||{on:{pf:0,pc:0},tot:{pf:0,pc:0}};a.tot.pf+=tot.pf;a.tot.pc+=tot.pc})});
 return{five:Object.values(five),pair:Object.values(pair),oo,used};
}

function gameStream(g){
 const st=[],c=e=>e.cr||0;
 g.events.forEach(e=>st.push({k:'us',e,q:e.q,t:e.t,cr:c(e)}));(g.oev||[]).forEach(e=>st.push({k:'op',e,q:e.q,t:e.t,cr:c(e)}));(g.subs||[]).forEach(x=>st.push({k:'sub',x,q:x.q,t:x.t,cr:c(x)}));
 return st.sort((a,b)=>QS.indexOf(a.q)-QS.indexOf(b.q)||a.t-b.t||a.cr-b.cr);
}
function runsOf(g,min=6){
 const st=gameStream(g),on=new Set(),out=[];let us=0,op=0,run=null,lastS=-1;
 const fin=()=>{if(run&&run.pts>=min)out.push(run);run=null};
 st.forEach((s,i)=>{
  if(s.k==='sub'){s.x.on?on.add(s.x.pid):on.delete(s.x.pid);return}
  const p=PTV[s.e.type];if(!p)return;
  if(!run||run.side!==s.k){fin();run={side:s.k,pts:0,from:[us,op],q:s.q,t:s.t,begin:lastS+1,five:[...on]}}
  run.pts+=p;if(s.k==='us')us+=p;else op+=p;run.to=[us,op];run.last=i;lastS=i;
 });
 fin();
 out.forEach(r=>{let to=0,miss=0,pf=0;const vic=r.side==='us'?'op':'us';for(let j=r.begin;j<=r.last;j++){const s=st[j];if(s.k!==vic)continue;const ty=s.e.type;if(ty==='TO')to++;else if(ty==='2X'||ty==='3X')miss++;else if(ty==='PF')pf++}r.vTO=to;r.vMiss=miss;r.vPF=pf});
 return out;
}
const pl=(n,a,b)=>`${n} ${n===1?a:b}`;
function runsHTML(g){
 const hasO=(g.oev||[]).some(e=>PTV[e.type]);
 if(!hasO)return '<div class="empty"><b>Faltan las canastas del rival</b>Para ver los parciales hay que etiquetar también los puntos del rival (botón RIVAL).</div>';
 const R=runsOf(g);if(!R.length)return '<p class="mut">No hay parciales de 6 o más puntos seguidos.</p>';
 const nm=i=>esc(player(i)?.name||'?'),mx=(side)=>Math.max(0,...R.filter(r=>r.side===side).map(r=>r.pts));
 const rv=mx('op'),mu=mx('us');
 return `<p>Mayor parcial en contra: <b>${rv?`0-${rv}`:'ninguno'}</b> · Mayor parcial a favor: <b>${mu?`${mu}-0`:'ninguno'}</b></p>
 <div class="card scroll"><table><tr><th class="l">Cuarto</th><th class="l">Vídeo</th><th>Parcial</th><th>Marcador</th><th class="l">Qué pasaba</th><th class="l">En pista al empezar</th></tr>${R.map(r=>{
  const us=r.side==='us',cls=r.pts>=8?(us?'up':'dn'):'',why=us?`Rival: ${pl(r.vTO,'pérdida','pérdidas')}, ${pl(r.vMiss,'tiro fallado','tiros fallados')}`:`Nosotros: ${pl(r.vTO,'pérdida','pérdidas')}, ${pl(r.vMiss,'tiro fallado','tiros fallados')}, ${pl(r.vPF,'falta','faltas')}`;
  return `<tr class="seekable" data-seek="${r.t}"><td class="l">${r.q}</td><td class="l">▶ ${fmtT(r.t)}</td><td><span class="pmv ${cls}">${us?r.pts+'-0':'0-'+r.pts}</span></td><td>${r.from[0]}-${r.from[1]} → ${r.to[0]}-${r.to[1]}</td><td class="l">${why}</td><td class="l">${r.five.length===5?r.five.map(nm).join(', '):'<span class="mut">–</span>'}</td></tr>`}).join('')}</table></div>
 <p class="note">Parcial = 6 o más puntos seguidos de un equipo sin respuesta. «Qué pasaba» cuenta las pérdidas, fallos y faltas del equipo que sufre el parcial entre su última canasta y el final de la racha. Verde o rojo: parciales de 8 o más. Toca una fila para ver la jugada en el vídeo.</p>`;
}
function toCard(gs){
 const L=gs.flatMap(g=>g.events.filter(e=>e.type==='TO').map(e=>({e,g})));
 if(!L.length)return '<p class="mut">Sin pérdidas etiquetadas.</p>';
 const cnt={};L.forEach(({e})=>{const k=e.sub&&TOSUB[e.sub]?e.sub:'_';cnt[k]=(cnt[k]||0)+1});
 const n=L.length,un=cnt._||0,keys=[...Object.keys(TOSUB),'_'].filter(k=>cnt[k]),mx=Math.max(...keys.map(k=>cnt[k]));
 const bars=keys.map(k=>`<div class="it"><span class="n"></span><span>${k==='_'?'Sin clasificar':TOSUB[k]}</span><span class="v">${cnt[k]} <small>(${Math.round(cnt[k]/n*100)}%)</small></span><div class="bar"><i style="width:${Math.max(4,cnt[k]/mx*100)}%"></i></div></div>`).join('');
 const byQ=QS.filter(q=>L.some(o=>o.e.q===q)).map(q=>`${q}: <b>${L.filter(o=>o.e.q===q).length}</b>`).join(' · ');
 const byP={};L.forEach(({e})=>byP[e.pid]=(byP[e.pid]||0)+1);const top=Object.entries(byP).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([id,v])=>`${esc(player(id)?.name||'?')} <b>${v}</b>`).join(' · ');
 return `<div class="lb">${bars}</div><p class="note">${n} pérdidas · por cuarto: ${byQ}</p><p class="note">Más pérdidas: ${top}</p>${un/n>.5?'<p class="note warn">Más de la mitad sin clasificar. Pulsa el tipo justo después de etiquetar la pérdida, o corrígelas en la pestaña Jugadas.</p>':''}`;
}
function foulCard(gs){
 const L=gs.flatMap(g=>g.events.filter(e=>e.type==='PF')),T=gs.flatMap(g=>g.tec||[]);
 if(!L.length&&!T.length)return '<p class="mut">Sin faltas etiquetadas.</p>';
 const rows=[['Normales',L.filter(e=>!e.sub).length],...Object.entries(FOULSUB).map(([k,l])=>[l,L.filter(e=>e.sub===k).length]),['Técnica al entrenador',T.filter(e=>e.who==='C').length],['Técnica al banquillo',T.filter(e=>e.who==='B').length]].filter(r=>r[1]);
 const mx=Math.max(...rows.map(r=>r[1])),sp=L.filter(e=>e.sub);
 const byP={};sp.forEach(e=>byP[e.pid]=(byP[e.pid]||0)+1);const top=Object.entries(byP).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([id,v])=>`${esc(player(id)?.name||'?')} <b>${v}</b>`).join(' · ');
 return `<div class="lb">${rows.map(([l,v])=>`<div class="it"><span class="n"></span><span>${l}</span><span class="v">${v}</span><div class="bar"><i style="width:${Math.max(4,v/mx*100)}%"></i></div></div>`).join('')}</div><p class="note">${L.length} faltas de jugadores${T.length?` · ${T.length} técnicas a entrenador o banquillo`:''}. Las técnicas y antideportivas de un jugador cuentan en sus faltas personales; las del entrenador y el banquillo no cuentan a ningún jugador.</p>${top?`<p class="note">Faltas especiales: ${top}</p>`:''}`;
}

function lgStats(ms){

/* Clasificación: 2 puntos por victoria, 1 por derrota. Desempate: enfrentamientos directos entre los empatados, después diferencia general */

   grp.sort((a,b)=>b.hh-a.hh||b.hhd-a.hhd||b.dif-a.dif||b.pf-a.pf||a.k.localeCompare(b.k))}
  out.push(...grp);i=j}
 out.forEach((t,i)=>t.pos=i+1);return out;
}

function plnRows(a,gp,id,rows_){

 if(rk&&rk.of>=3){const th=Math.ceil(rk.of/3),tone=rk.pos<=th?'ok':rk.pos>rk.of-Math.floor(rk.of/3)?'bad':'mid';

function ttRef(id,A,g){

 switch(id){
  case 'a_reo':return hasO?`RO ${a.oreb} · ${pct(div(a.oreb,a.oreb+o.dreb))} de los rebotes ofensivos posibles`:`RO ${a.oreb}`;
  case 'd_reb':return hasO?`RD ${a.dreb} · ${pct(div(a.dreb,a.dreb+o.oreb))} de los rebotes defensivos posibles · el rival cogió ${o.oreb} RO`:`RD ${a.dreb}`;
  case 'd_pas':return `Robos ${a.stl}${hasO?` · pérdidas del rival ${o.to}`:''}`;
  case 'd_bal':return hasO&&o.fga?`eFG% del rival ${pct(o.efg)}`:'';
  case 'd_tir':return hasO&&o.tpa?`Triples del rival ${o.tpm}/${o.tpa} (${pct(o.tpp)})`:'';
  case 'd_fal':return `Faltas cometidas ${a.pf}${hasO?` · tiros libres del rival ${o.fta}`:''}`;
  case 'a_ven':return `Faltas recibidas ${a.pfd} · tiros libres intentados ${a.fta}`;
  case 'a_esp':{const z=zoneStats(g.events).z.tc;return z.a?`Triples de esquina ${z.m}/${z.a}`:''}
  case 'a_cir':case 'a_pnr':return a.fgm?`Asistencias en el ${pct(A.astr)} de las canastas`:'';
  case 'a_pos':{const z=zoneStats(g.events).z.pa;return z.a?`Pintura: ${z.m}/${z.a} tiros`:''}
  case 'a_sel':return a.fga?`eFG% ${pct(a.efg)}`:'';
  case 'a_pre':return `Pérdidas ${a.to} (${pct(a.tovp)} de las jugadas)`;
  default:return '';
 }
}

function SafeObj(){return {}}
const plActive=()=>S.players.filter(p=>!p.arch);

function plMatches(d){
 const L=S.league||{},me=L.me,out=[];
 (L.rounds||[]).forEach(r=>{if(r.date!==d)return;(r.m||[]).forEach(m=>{
  if(!me||(m.h!==me&&m.a!==me))return;
  const home=m.h===me,rv=home?m.a:m.h,mine=home?m.hs:m.vs,th=home?m.vs:m.hs,has=mine!==''&&mine!=null&&th!==''&&th!=null;
  out.push({rival:rv,home,n:r.n,res:has?`${mine}–${th}`:null,w:has?(+mine>+th?'V':+mine<+th?'D':'E'):null})})});
 if(!(L.rounds||[]).length)S.games.filter(g=>!g.ex&&g.date===d).forEach(g=>{const o=oppOf(g);out.push({rival:g.opp||'Rival',home:null,res:o!=null?`${teamPts(g)}–${o}`:null,w:resultOf(g)})});
 return out;
}
function plWeek(mon){
 const P=plData(),days=[];
 for(let i=0;i<7;i++){
  const d=plAdd(mon,i),it=[];
  P.sched.filter(s=>s.wd===i).forEach(s=>it.push({k:'ent',id:s.id,date:d,t:s.t,dur:s.dur,place:s.place,key:d+'|'+s.id}));
  P.extra.filter(x=>x.date===d).forEach(x=>it.push({k:x.type==='part'?'part':'ent',id:x.id,date:d,t:x.t,dur:x.dur,place:x.place,note:x.note,rival:x.rival,extra:true,key:d+'|'+x.id}));
  plMatches(d).forEach(m=>it.push({k:'part',date:d,...m,key:'m|'+d+'|'+(m.rival||'')}));
  it.sort((a,b)=>(a.t||'99').localeCompare(b.t||'99'));
  days.push({d,it});
 }
 return days;
}

function plWeekText(){
 const P=plData(),L=[`📅 Semana del ${plShort(PLS.wk)} al ${plShort(plAdd(PLS.wk,6))} · ${plTeam()}`];
 plWeek(PLS.wk).forEach(({d,it})=>{
  if(!it.length)return;L.push('',`*${plCap(plDay(d))}*`);
  it.forEach(x=>{
   if(x.k==='part'){L.push(`🏀 Partido${x.rival?' vs '+x.rival:''}${x.home===true?' (local)':x.home===false?' (visitante)':''}${x.t?' · '+x.t:''}${x.place?' · '+x.place:''}${x.res?' → '+x.res:''}`);return}
   const s=P.ses[x.key]||{};
   if(s.off){L.push(`⛔ Entrenamiento anulado${x.t?' ('+x.t+')':''}`);return}
   L.push(`🏋️ Entrenamiento${x.t?' '+x.t:''}${x.dur?' · '+x.dur+' min':''}${x.place?' · '+x.place:''}`);
   (s.drills||[]).forEach(id=>DRILLS[id]&&L.push(`   • ${DRILLS[id].n}`));

 });

}

const brLine=(n,x)=>`${n}: TC ${x.fgm}/${x.fga} · T3 ${x.tpm}/${x.tpa} · TL ${x.ftm}/${x.fta} · rebotes ${x.reb} (${x.oreb} ofensivos) · asistencias ${x.ast} · robos ${x.stl} · tapones ${x.blk} · pérdidas ${x.to} · faltas ${x.pf}`;
function brGame(g,names){
 const A=teamAdv(g.events,g.oppScore,g.oev),o=oppOf(g),r=resultOf(g),pm=(typeof plusMinus==='function')?plusMinus(g):null,L=[];
 L.push(`PARTIDO: ${plTeam()} ${o!=null?teamPts(g)+'–'+o:''} vs ${g.opp||'rival'} (${g.date})${r?' · '+({V:'victoria',D:'derrota',E:'empate'})[r]:''}`);
 L.push('Parciales (nosotros-rival): '+[0,1,2,3].map(i=>{const q=QS[i],me=agg(g.events.filter(e=>e.q===q)).pts,ot=qOpp(g,i);return `${q} ${me}${ot!=null?'-'+ot:''}`}).join(' | '));
 L.push(brLine('Equipo',A.a));
 if(A.hasO)L.push(brLine('Rival (según jugadas etiquetadas)',A.oa));
 if(A.ortg!=null)L.push(`Posesiones estimadas ~${Math.round(A.pos)} · ataque ${A.ortg.toFixed(1)} puntos/100 posesiones${A.drtg!=null?' · defensa '+A.drtg.toFixed(1):''}`);
 if(names){
  L.push('','JUGADORES (dorsal nombre · minutos · puntos · TC · T3 · TL · rebotes · asistencias · robos · pérdidas · faltas · valoración'+(pm?' · +/-':'')+'):');
  S.players.forEach(p=>{if(!g.events.some(e=>e.pid===p.id))return;const x=agg(g.events.filter(e=>e.pid===p.id));
   L.push(`${p.num||'?'} ${p.name} · ${(g.min||{})[p.id]!=null?(g.min||{})[p.id]+' min':'min ?'} · ${x.pts} · ${x.fgm}/${x.fga} · ${x.tpm}/${x.tpa} · ${x.ftm}/${x.fta} · ${x.reb} · ${x.ast} · ${x.stl} · ${x.to} · ${x.pf} · ${x.feb}${pm?' · '+sg(pm[p.id]!=null?pm[p.id]:0):''}`)});
 }
 const {I}=teamIssues(teamCtx([g]));
 if(I.length)L.push('','FALLOS QUE DETECTA LA APP: '+I.slice(0,4).map(i=>`${i.title} (${i.ev})`).join('; '));
 if(o!=null&&A.hasO&&!A.okO)L.push(`Aviso: los puntos etiquetados del rival (${A.oa.pts}) no coinciden con su marcador final (${o}).`);
 return L.join('\n');
}

 L.push('','PARTIDOS:');gs.forEach(g=>{const o=oppOf(g);L.push(`- ${g.date} vs ${g.opp||'rival'}: ${o!=null?teamPts(g)+'–'+o:'sin marcador'}`)});

 return L.join('\n');

 if(!r.ok)throw new Error('http '+r.status);
 const rows=await r.json();
 cMeta={ver:rows[0].version,dirty:cChg!==my,last:Date.now()};cSet(C_META,cMeta);setSync(cMeta.dirty?'pend':'ok');if(cMeta.dirty)cloudSoon();
}
async function cloudPush(){
 const my=cChg;
 const r=await cApi('/rest/v1/app_state?select=version&user_id=eq.'+cAuth.uid+'&version=eq.'+cMeta.ver,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({data:S,version:cMeta.ver+1})});
 if(!r.ok)throw new Error('http '+r.status);
 const rows=await r.json();
 if(!rows.length){const row=await cRow();return row?cloudConflict(row):cloudInsert()}
 cMeta={ver:rows[0].version,dirty:cChg!==my,last:Date.now()};cSet(C_META,cMeta);setSync(cMeta.dirty?'pend':'ok');if(cMeta.dirty)cloudSoon();
}
function applyRemote(row,msg){
 if(cMeta.dirty&&cHas(S))cSet(C_STASH,{when:Date.now(),data:S}); /* red de seguridad: lo descartado queda guardado */
 S=row.data;if(!S.players)S.players=[];if(!S.games)S.games=[];if(!S.settings)S.settings={pre:5,post:4};
 try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
 cMeta={ver:row.version,dirty:false,last:Date.now()};cSet(C_META,cMeta);cNewer=null;setSync('ok');
 route();if(msg)toast(msg);
}
function cModal(build){
 const old=document.getElementById('cmodal');if(old)old.remove();
 const o=document.createElement('div');o.id='cmodal';o.className='noprint';o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
 const b=document.createElement('div');b.className='card';b.style.cssText='max-width:460px;width:100%;margin:0;max-height:90vh;overflow:auto';
 o.appendChild(b);document.body.appendChild(o);build(b,()=>o.remove());return o;
}
function cloudConflict(row){
 const L=S,R=row.data,n=s=>`${(s.games||[]).length} partido(s), ${(s.players||[]).length} jugador(es)`;
 cModal((b,close)=>{
  b.innerHTML=`<h3 style="margin-top:0">Los datos no coinciden</h3><p>Este dispositivo y la nube tienen datos distintos.</p>
  <p><b>La nube</b> (guardado ${cAgo(Date.parse(row.updated_at))}): ${n(R)}.<br><b>Este dispositivo</b>: ${n(L)}.</p>
  <p class="mut">Lo que no elijas queda guardado como copia de seguridad: en este dispositivo, si descartas lo local; en la nube, en el historial de copias.</p>
  <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn pri" id="cuc">Usar los datos de la nube</button><button class="btn" id="cud">Usar los de este dispositivo</button></div>`;
  b.querySelector('#cuc').onclick=()=>{cMeta.dirty=true;applyRemote(row,'Datos de la nube cargados');close()};
  b.querySelector('#cud').onclick=()=>{cMeta={ver:row.version,dirty:true,last:cMeta.last};cSet(C_META,cMeta);close();cBusy=false;cloudSync(false)};
 });
 setSync('pend');
}

async function cloudAuth(email,pw,create){
 const r=await fetch(SB_URL+(create?'/auth/v1/signup':'/auth/v1/token?grant_type=password'),{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});
 const j=await r.json().catch(()=>({}));
 if(!r.ok){
  const m=j.msg||j.error_description||j.message||('Error '+r.status);
  if(/database error|registro cerrado/i.test(m))throw new Error('Ya existe una cuenta: esta aplicación es de uso personal. Usa «Entrar».');
  if(/invalid login/i.test(m))throw new Error('Correo o contraseña incorrectos.');
  if(/not confirmed/i.test(m))throw new Error('Falta confirmar el correo: abre el mensaje que te ha llegado y pulsa el enlace.');
  throw new Error(m);
 }
 if(!j.access_token)return 'confirm';
 cSession(j);return 'ok';
}
function cloudPanel(){
 cModal((b,close)=>{
  if(cAuth){
   const st=cGet(C_STASH,null);
   b.innerHTML=`<h3 style="margin-top:0">Sincronización</h3><p>Sesión: <b></b><br><span class="mut">Último guardado en la nube: ${cAgo(cMeta.last)}</span></p>
   <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn pri" id="cs">Sincronizar ahora</button><button class="btn" id="co">Cerrar sesión</button><button class="btn" id="cx">Cerrar</button></div>
   ${st?'<p class="mut" style="margin-top:14px">Hay una copia local descartada en un conflicto anterior.</p><button class="btn" id="cd">Descargar esa copia</button>':''}`;
   b.querySelector('b').textContent=cAuth.email;
   b.querySelector('#cs').onclick=()=>{close();cloudSync(false)};
   b.querySelector('#co').onclick=()=>{if(cMeta.dirty&&!confirm('Hay cambios sin subir. Si cierras sesión seguirán en este dispositivo, pero no estarán en la nube. ¿Cerrar sesión?'))return;cAuth=null;try{localStorage.removeItem(C_AUTH)}catch(e){}setSync('login');close()};
   b.querySelector('#cx').onclick=close;
   const d=b.querySelector('#cd');if(d)d.onclick=()=>download('mi-stats-copia-descartada-'+new Date(st.when).toISOString().slice(0,10)+'.json',JSON.stringify(st.data),'application/json');
  }else{
   b.innerHTML=`<h3 style="margin-top:0">Guardar en la nube</h3><p class="mut">Tus datos se guardan en tu cuenta privada (servidor en la UE) y se abren en cualquier dispositivo con el mismo correo y contraseña. Esta aplicación admite una única cuenta.</p>
   <label>Correo<br><input id="ce" type="email" autocomplete="username" style="width:100%"></label>
   <label style="display:block;margin-top:8px">Contraseña (mín. 8 caracteres)<br><input id="cp" type="password" autocomplete="current-password" style="width:100%"></label>
   <p id="cm" style="min-height:1.3em;color:var(--warn,#b3261e)"></p>
   <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn pri" id="cin">Entrar</button><button class="btn" id="ccr">Crear cuenta (primera vez)</button><button class="btn" id="cx">Ahora no</button></div>`;
   const msg=t=>{b.querySelector('#cm').textContent=t},go=async create=>{
    const e=b.querySelector('#ce').value.trim(),p=b.querySelector('#cp').value;
    if(!e||p.length<8)return msg('Escribe el correo y una contraseña de al menos 8 caracteres.');
    msg('Un momento…');
    try{const r=await cloudAuth(e,p,create);
     if(r==='confirm'){msg('Cuenta creada. Confirma el correo (te hemos enviado un enlace) y vuelve a pulsar «Entrar».');return}
     close();toast('Sesión iniciada');cloudSync(true);
    }catch(err){msg(err.message==='Failed to fetch'?'Sin conexión a internet.':err.message)}};
   b.querySelector('#cin').onclick=()=>go(false);b.querySelector('#ccr').onclick=()=>go(true);b.querySelector('#cx').onclick=close;
   b.querySelector('#cp').onkeydown=ev=>{if(ev.key==='Enter')go(false)};
  }
 });
}

if(!RO){
 window.addEventListener('online',()=>cloudSync(false));
 document.addEventListener('visibilitychange',()=>{if(cAuth&&(document.visibilityState==='hidden'?cMeta.dirty:true))cloudSync(false)});
 setInterval(()=>{if(cAuth&&cMeta.dirty)cloudSync(false);else if(cAuth&&cState==='ok')setSync('ok')},60000);
 cAuth?(cMeta.dirty?setSync('pend'):setSync('ok'),cloudSync(true)):setSync('login');
}else{const e=document.getElementById('sync');if(e)e.remove()}

$('#cbtn').onclick=()=>claudeBrief();
route();
</script>
</body>
